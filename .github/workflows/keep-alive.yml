# Keeps the free Supabase project from being paused.
#
# Supabase pauses a free project that has seen little database activity over the
# past week, and says that a few requests a day are typically enough to prevent
# it. So once a day this job reads one row from the database, three times. While
# the site has visitors of its own this makes no difference. It matters in the
# quiet months after a trip.
#
# The 60-day limit, and why this job does not work around it
#
# GitHub switches off scheduled workflows in a public repository once the
# repository has gone 60 days without activity. A workflow can switch itself
# back on through GitHub's API, but this one deliberately does not: GitHub
# treats automated ways around that limit as a breach of its terms of service
# (it took down the best-known keep-alive action for it), and the repository
# that would be put at risk is the one this site is served from.
#
# Instead the job gives warning. From 45 days after the last commit it fails
# once a week, on Mondays, which makes GitHub email whoever set up this
# workflow. The remedy is a manual one: push any change to the repository, or,
# if the schedule has already been switched off, turn it back on under
# Actions > Keep Supabase awake > Enable workflow.
name: Keep Supabase awake

on:
  schedule:
    # Every day at 05:23 UTC. An odd minute on purpose: runs scheduled on the
    # hour are the ones GitHub delays or drops when it is busy.
    - cron: '23 5 * * *'
  # Adds a "Run workflow" button in the Actions tab, to try the job by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only needed to read .env.production and the date of the last commit.
      - uses: actions/checkout@v7

      - name: Read one row from the database, three times
        run: |
          file=.env.production
          # Reads one value the way Vite does: the last assignment wins, and
          # quotes, a leading "export" and Windows line endings are ignored.
          setting() {
            grep -E "^[[:space:]]*(export[[:space:]]+)?$1[[:space:]]*=" "$file" | tail -n 1 | cut -d= -f2- | tr -d "\r\"'" | awk '{ print $1 }' || true
          }

          if [ ! -f "$file" ]; then
            echo "::notice::$file does not exist yet, so there is no Supabase project to keep awake."
            exit 0
          fi
          url=$(setting VITE_SUPABASE_URL)
          key=$(setting VITE_SUPABASE_KEY)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::notice::$file does not name a Supabase project yet, so there is nothing to keep awake."
            exit 0
          fi

          # The publishable key is sent as "apikey", the same way the site sends it.
          for attempt in 1 2 3; do
            if ! curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 5 \
              --output /dev/null --header "apikey: $key" "${url%/}/rest/v1/trips?select=id&limit=1"; then
              echo "::error::The Supabase project did not answer. If it has been paused, open it in the Supabase dashboard and resume it. If it is new, run supabase/schema.sql first (see README.md)."
              exit 1
            fi
            sleep 2
          done
          echo "The database answered three times."

      - name: Warn before GitHub switches this schedule off
        if: github.event_name == 'schedule'
        run: |
          # The date of the newest commit stands in for "repository activity",
          # which GitHub does not define any more precisely.
          last_commit=$(git log -1 --format=%ct)
          idle_days=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "The last commit was $idle_days days ago."
          if [ "$idle_days" -lt 45 ]; then
            exit 0
          fi

          message="No commits for $idle_days days. GitHub switches scheduled workflows off after 60 days without repository activity, and without this job Supabase pauses the project once it has been quiet for a week. To keep it running, push any change to the repository. If the schedule has already been switched off, turn it back on under Actions > Keep Supabase awake > Enable workflow."
          # Failing is what makes GitHub send an email. Once a week is enough.
          if [ "$(date -u +%u)" = 1 ]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::warning::$message"
